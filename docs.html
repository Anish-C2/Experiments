<html lang="en">

<body class="docs-body">

<div class="docs-shell">
  <aside class="docs-sidebar"><div class="side-label">AVAILABLE DOCS</div><div id="doc-list">Loading docs…</div></aside>
  <main class="docs-content"><div class="doc-head"><span class="doc-kicker">CASPER // DOCUMENTATION</span><h1 id="title">DOCUMENTATION</h1><p id="subtitle">Loading available documentation from <code>docs/</code>…</p></div><div class="status" id="status">Discovering Markdown files in <code>docs/</code>.</div><article class="markdown" id="markdown"></article></main>
</div>
<script>
const root='docs/';const list=document.getElementById('doc-list'),md=document.getElementById('markdown'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),status=document.getElementById('status');let docs=[];
function escape(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){s=escape(s);s=s.replace(/`([^`]+)`/g,'<code>$1</code>');s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');return s}
function render(src){const lines=src.replace(/\r/g,'').split('\n'),out=[];let i=0,inCode=false,code=[];while(i<lines.length){const l=lines[i];if(l.startsWith('```')){if(!inCode){inCode=true;code=[]}else{out.push('<pre><code>'+escape(code.join('\n'))+'</code></pre>');inCode=false}i++;continue}if(inCode){code.push(l);i++;continue}if(!l.trim()){i++;continue}if(/^#{1,4} /.test(l)){const n=l.match(/^#+/)[0].length;out.push('<h'+n+'>'+inline(l.slice(n+1))+'</h'+n+'>');i++;continue}if(/^---+$/.test(l.trim())){out.push('<hr>');i++;continue}if(l.startsWith('> ')){out.push('<blockquote>'+inline(l.slice(2))+'</blockquote>');i++;continue}if(/^[-*] /.test(l)){const items=[];while(i<lines.length&&/^[-*] /.test(lines[i])){items.push('<li>'+inline(lines[i].slice(2))+'</li>');i++}out.push('<ul>'+items.join('')+'</ul>');continue}if(/^\d+\. /.test(l)){const items=[];while(i<lines.length&&/^\d+\. /.test(lines[i])){items.push('<li>'+inline(lines[i].replace(/^\d+\. /,''))+'</li>');i++}out.push('<ol>'+items.join('')+'</ol>');continue}if(l.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-+:?/.test(lines[i+1])){const parse=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(v=>v.trim());const h=parse(l);let j=i+2,rows=[];while(j<lines.length&&lines[j].includes('|')){rows.push(parse(lines[j]));j++}out.push('<table><thead><tr>'+h.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');i=j;continue}const para=[l];i++;while(i<lines.length&&lines[i].trim()&&!/^#{1,4} /.test(lines[i])&&!/^```/.test(lines[i])&&!/^[-*] /.test(lines[i])&&!/^\d+\. /.test(lines[i])&&!lines[i].includes('|')){para.push(lines[i]);i++}out.push('<p>'+inline(para.join(' '))+'</p>')}return out.join('')}
function name(path){return path.split('/').pop().replace(/\.md$/i,'').replace(/[_-]+/g,' ').replace(/\b\w/g,x=>x.toUpperCase())}
function renderList(){list.innerHTML=docs.map(d=>'<a class="doclink" href="?doc='+encodeURIComponent(d.name)+'" data-name="'+d.name+'">'+name(d.name)+'<small>'+d.name+'</small></a>').join('')}
async function openDoc(file){document.querySelectorAll('.doclink').forEach(x=>x.classList.toggle('active',x.dataset.name===file));title.textContent=name(file);subtitle.textContent='CASPER documentation · docs/'+file;try{const r=await fetch(root+file+'?v='+Date.now());if(!r.ok)throw Error('Unable to load '+file);md.innerHTML=render(await r.text());document.title='CASPER — '+name(file)}catch(e){md.innerHTML='<div class="error">'+e.message+'</div>'}}
async function discover(){try{const r=await fetch('https://api.github.com/repos/Anish-C2/Experiments/contents/docs');if(!r.ok)throw Error('GitHub API returned '+r.status);const files=await r.json();docs=files.filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.md')).sort((a,b)=>a.name.localeCompare(b.name));if(!docs.length)throw Error('No Markdown files found in docs/');renderList();const wanted=new URLSearchParams(location.search).get('doc');const first=docs.find(x=>x.name===wanted)||docs[0];await openDoc(first.name);status.textContent=docs.length+' Markdown document'+(docs.length===1?'':'s')+' discovered from docs/.'}catch(e){status.className='error';status.textContent='Could not discover docs: '+e.message}}
discover();
</script>
</body>
</html>
