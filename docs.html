<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASPER — Docs</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><style>:root{--n:#07111f;--p:#f3f1ea;--w:#fff;--g:#c9a227;--i:#172231;--m:#68737d;--l:#d6d2c9;--code:#101a26}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--p);color:var(--i);font:14px/1.65 Inter,Arial,sans-serif}.top{height:58px;background:var(--n);border-bottom:2px solid var(--g);display:flex;align-items:center;padding:0 24px;gap:28px;position:sticky;top:0;z-index:20}.brand{color:#fff;text-decoration:none;font:700 25px 'Barlow Condensed';letter-spacing:.08em}.mark{display:inline-grid;place-items:center;width:29px;height:29px;border:1px solid var(--g);color:var(--g);margin-right:7px}.back{margin-left:auto;color:#bfc8d0;text-decoration:none;font-size:11px;font-weight:700}.layout{display:grid;grid-template-columns:250px minmax(0,920px);max-width:1240px;margin:auto;gap:0;align-items:start}.sidebar{position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;padding:24px 18px 30px 0;border-right:1px solid var(--l)}.side-label{font-size:9px;letter-spacing:.16em;font-weight:800;color:var(--g);margin-bottom:9px}.doclink{display:block;padding:8px 10px;color:var(--i);text-decoration:none;border-left:3px solid transparent;font-size:12px;font-weight:600}.doclink:hover,.doclink.active{background:#e8e5dc;border-left-color:var(--g)}.doclink small{display:block;color:var(--m);font-size:9px;font-weight:400}.content{background:var(--w);min-height:calc(100vh - 58px);padding:42px 58px 80px}.doc-head{border-bottom:2px solid var(--i);padding-bottom:22px;margin-bottom:28px}.doc-kicker{color:var(--g);font-size:10px;font-weight:800;letter-spacing:.16em}.doc-head h1{font:700 50px/.9 'Barlow Condensed';margin:8px 0}.doc-head p{color:var(--m);margin:0;max-width:720px}.markdown h1,.markdown h2,.markdown h3,.markdown h4{font-family:'Barlow Condensed';line-height:1.05}.markdown h1{font-size:38px;border-bottom:1px solid var(--l);padding-bottom:10px}.markdown h2{font-size:29px;border-bottom:1px solid var(--l);padding-bottom:7px;margin-top:38px}.markdown h3{font-size:22px;margin-top:28px}.markdown p{margin:11px 0}.markdown a{color:#315a7d;font-weight:600}.markdown strong{font-weight:700}.markdown ul,.markdown ol{padding-left:25px}.markdown li{margin:3px 0}.markdown blockquote{margin:16px 0;padding:9px 15px;border-left:4px solid var(--g);background:#f5f2e9;color:#4d5963}.markdown code{font:13px 'JetBrains Mono',monospace;background:#ece9e0;padding:2px 5px;border-radius:2px}.markdown pre{background:var(--code);color:#e9edf0;border:1px solid #26384b;padding:17px;overflow:auto;border-radius:2px;line-height:1.55}.markdown pre code{background:none;padding:0;color:inherit}.markdown table{width:100%;border-collapse:collapse;margin:18px 0;font-size:13px}.markdown th{text-align:left;background:#ece9e0;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.markdown th,.markdown td{padding:8px 10px;border:1px solid var(--l);vertical-align:top}.markdown hr{border:0;border-top:2px solid var(--l);margin:30px 0}.status{padding:9px 12px;background:#eef1ec;border-left:3px solid #718a73;color:#405346;font-size:11px;margin-bottom:22px}.error{padding:16px;background:#f4e9e5;border-left:3px solid #a85c45;color:#63382d}@media(max-width:850px){.layout{display:block}.sidebar{position:relative;top:auto;height:auto;border-right:0;border-bottom:1px solid var(--l);padding:12px;display:flex;gap:4px;overflow:auto;white-space:nowrap}.side-label{display:none}.doclink{display:inline-block;border-left:0;border-bottom:3px solid transparent}.doclink:hover,.doclink.active{border-left:0;border-bottom-color:var(--g)}.content{padding:28px 20px 60px}.doc-head h1{font-size:42px}} </style></head><body><header class="top"><a class="brand" href="index.html"><span class="mark">C</span>CASPER</a><span style="color:#71808d;font-size:10px;font-weight:700;letter-spacing:.15em">DOCUMENTATION</span><a class="back" href="index.html">← SITE</a></header><div class="layout"><aside class="sidebar"><div class="side-label">AVAILABLE DOCS</div><div id="doc-list">Loading docs…</div></aside><main class="content"><div class="doc-head"><span class="doc-kicker">CASPER // DOCUMENTATION</span><h1 id="title">DOCUMENTATION</h1><p id="subtitle">Loading available documentation from <code>docs/</code>…</p></div><div class="status" id="status">Discovering Markdown files in <code>docs/</code>.</div><article class="markdown" id="markdown"></article></main></div><script>const root='docs/';const list=document.getElementById('doc-list'),md=document.getElementById('markdown'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),status=document.getElementById('status');let docs=[],current='';
function inline(s){s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');s=s.replace(/`([^`]+)`/g,'<code>$1</code>');s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');return s}
function render(src){const lines=src.replace(/\r/g,'').split('\n'),out=[];let i=0,inCode=false,code=[],lang='';while(i<lines.length){let l=lines[i];if(l.startsWith('```')){if(!inCode){inCode=true;code=[];lang=l.slice(3).trim()}else{out.push('<pre><code>'+code.join('\n').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</code></pre>');inCode=false}i++;continue}if(inCode){code.push(l);i++;continue}if(!l.trim()){i++;continue}if(/^#{1,4} /.test(l)){let n=l.match(/^#+/)[0].length;out.push('<h'+n+'>'+inline(l.slice(n+1))+'</h'+n+'>');i++;continue}if(/^---+$/.test(l.trim())){out.push('<hr>');i++;continue}if(l.startsWith('> ')){out.push('<blockquote>'+inline(l.slice(2))+'</blockquote>');i++;continue}if(/^[-*] /.test(l)){let items=[];while(i<lines.length&&/^[-*] /.test(lines[i])){items.push('<li>'+inline(lines[i].slice(2))+'</li>');i++}out.push('<ul>'+items.join('')+'</ul>');continue}if(/^\d+\. /.test(l)){let items=[];while(i<lines.length&&/^\d+\. /.test(lines[i])){items.push('<li>'+inline(lines[i].replace(/^\d+\. /,''))+'</li>');i++}out.push('<ol>'+items.join('')+'</ol>');continue}if(l.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-+:?/.test(lines[i+1])){let parse=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(v=>v.trim());let h=parse(l),j=i+2,rows=[];while(j<lines.length&&lines[j].includes('|')){rows.push(parse(lines[j]));j++}out.push('<table><thead><tr>'+h.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');i=j;continue}let para=[l];i++;while(i<lines.length&&lines[i].trim()&&!/^#{1,4} /.test(lines[i])&&!/^```/.test(lines[i])&&!/^[-*] /.test(lines[i])&&!/^\d+\. /.test(lines[i])&&!lines[i].includes('|')){para.push(lines[i]);i++}out.push('<p>'+inline(para.join('\n').replace(/\n/g,' '))+'</p>')}return out.join('')}
function name(path){return path.split('/').pop().replace(/\.md$/i,'').replace(/[_-]+/g,' ').replace(/\b\w/g,x=>x.toUpperCase())}
async function discover(){try{const r=await fetch('https://api.github.com/repos/Anish-C2/Experiments/contents/docs');if(!r.ok)throw Error('GitHub API returned '+r.status);const files=await r.json();docs=files.filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.md')).sort((a,b)=>a.name.localeCompare(b.name));if(!docs.length)throw Error('No Markdown files found in docs/');renderList();let wanted=new URLSearchParams(location.search).get('doc');let first=docs.find(x=>x.name===wanted)||docs[0];await openDoc(first.name);status.textContent=docs.length+' Markdown document'+(docs.length===1?'':'s')+' discovered from docs/.'}catch(e){status.className='error';status.textContent='Could not discover docs: '+e.message}}
function renderList(){list.innerHTML=docs.map(d=>'<a class="doclink" href="?doc='+encodeURIComponent(d.name)+'" data-name="'+d.name+'">'+name(d.name)+'<small>'+d.name+'</small></a>').join('')}
async function openDoc(file){current=file;document.querySelectorAll('.doclink').forEach(x=>x.classList.toggle('active',x.dataset.name===file));title.textContent=name(file);subtitle.textContent='CASPER documentation · docs/'+file;try{const r=await fetch(root+file+'?v='+Date.now());if(!r.ok)throw Error('Unable to load '+file);md.innerHTML=render(await r.text());document.title='CASPER — '+name(file)}catch(e){md.innerHTML='<div class="error">'+e.message+'</div>'}}
discover();</script></body></html>
