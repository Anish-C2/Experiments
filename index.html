<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPA — CASPER Statistics Command Center</title>
  <link rel="stylesheet" href="css/spa.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="menu" id="menu-btn" type="button">Menu</button>
      <a class="brand" href="#/dashboard">
        <span class="mark">CA</span>
        <span>SPA<span><small>CASPER STATISTICS</small></span></span>
      </a>
      <nav class="nav">
        <a href="#/dashboard" data-view="dashboard">Dashboard</a>
        <a href="#/rankings" data-view="rankings">Rankings</a>
        <a href="#/players" data-view="players">Players</a>
        <a href="#/teams" data-view="teams">Clubs</a>
        <a href="#/competitions" data-view="competitions">Competitions</a>
        <a href="#/matches" data-view="matches">Matches</a>
        <a href="#/seasons" data-view="seasons">Seasons / Sectors</a>
        <a href="#/records" data-view="records">Records</a>
        <a href="#/debug" data-view="debug">Validator</a>
      </nav>
      <div class="searchwrap">
        <input id="q" placeholder="Search players, clubs, events…" autocomplete="off">
      </div>
    </header>
    <div id="hits" class="searchhits"></div>
    <div class="sportchips">
      <span class="muted" style="font:700 10px ui-monospace,Consolas,monospace">SPORT DOMAIN</span>
      <button class="chip futsal" data-sport="futsal" type="button">Futsal</button>
      <button class="chip football" data-sport="football" type="button">Football</button>
      <button class="chip cricket" data-sport="cricket" type="button">Cricket</button>
      <span class="muted">Filters combine with sector + season.</span>
    </div>
    <div class="filters">
      <label>Sector <select id="f-sector"></select></label>
      <label>Season <select id="f-season"></select></label>
    </div>
    <main id="view"></main>
    <footer>
      <span>SPA reads CSN directly. Sports never share goal/run totals.</span>
      <span id="issue-count">—</span>
    </footer>
  </div>
  <script src="js/parser.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
