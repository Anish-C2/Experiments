<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASPER — Records</title><link rel="stylesheet" href="css/style.css?v=9"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">C</span>CASPER</a><nav><a href="index.html">HOME</a><a href="sectors.html">SECTORS</a><a href="competitions.html">COMPETITIONS</a><a href="clubs.html">CLUBS</a><a href="players.html">PLAYERS</a><a class="active" href="records.html">RECORDS</a><a href="docs.html">DOCS</a></nav></header><main><section class="mast"><div><span class="eyebrow">CASPER // STATISTICAL ARCHIVE</span><h1>RECORDS</h1><p>Sport-separated record board and network statistical snapshot. Demonstration values are marked as mock until official archive derivation is enabled.</p></div></section><div id="records"></div></main><script src="js/data.js"></script><script>(async()=>{try{const d=await CASPER_DATA.load(),s=d.dashboard.sports||{},h=document.querySelector('#records'),mock=d.dashboard.mock?'MOCK DATA':'ARCHIVE DATA';h.innerHTML=`<div class="stats">${[['DATASET',mock,'source status'],['FOOTBALL MATCHES',s.football?.matches??0,'football only'],['FOOTBALL GOALS',s.football?.goals??0,'football only'],['FUTSAL MATCHES',s.futsal?.matches??0,'futsal only'],['FUTSAL GOALS',s.futsal?.goals??0,'futsal only'],['CRICSAL MATCHES',s.cricsal?.matches??0,'cricsal only'],['CRICSAL RUNS',s.cricsal?.runs??0,'cricsal only'],['CRICSAL WICKETS',s.cricsal?.wickets??0,'cricsal only']].map(x=>`<div><small>${x[0]}</small><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('')}</div><section class="box" style="margin-top:10px"><header><div><small>RECORD BOARD</small><h2>CURRENT DEMONSTRATION RECORDS</h2></div></header><div class="record-list"><div><small>FOOTBALL · BIGGEST WIN</small><b>7–0</b><span>demo record</span></div><div><small>FUTSAL · HIGHEST TEAM SCORE</small><b>11</b><span>demo record</span></div><div><small>CRICSAL · MOST RUNS</small><b>96</b><span>demo record</span></div><div><small>CRICSAL · MOST WICKETS</small><b>6</b><span>demo record</span></div><div><small>FOOTBALL · LONGEST WIN STREAK</small><b>11</b><span>demo record</span></div><div><small>NETWORK · ATTENDANCE</small><b>184</b><span>demo record</span></div></div></section><div class="detail-grid"><div class="box"><header><div><small>FOOTBALL</small><h2>GOALS</h2></div></header><div class="record-list"><div><small>TOTAL GOALS</small><b>${s.football?.goals??0}</b><span>network</span></div><div><small>MATCHES</small><b>${s.football?.matches??0}</b><span>network</span></div><div><small>AVERAGE</small><b>${s.football?.average??'—'}</b><span>goals / match</span></div></div></div><div class="box"><header><div><small>FUTSAL</small><h2>GOALS</h2></div></header><div class="record-list"><div><small>TOTAL GOALS</small><b>${s.futsal?.goals??0}</b><span>network</span></div><div><small>MATCHES</small><b>${s.futsal?.matches??0}</b><span>network</span></div><div><small>AVERAGE</small><b>${s.futsal?.average??'—'}</b><span>goals / match</span></div></div></div><div class="box"><header><div><small>CRICSAL</small><h2>RUNS + WICKETS</h2></div></header><div class="record-list"><div><small>TOTAL RUNS</small><b>${s.cricsal?.runs??0}</b><span>network</span></div><div><small>WICKETS</small><b>${s.cricsal?.wickets??0}</b><span>network</span></div><div><small>MATCHES</small><b>${s.cricsal?.matches??0}</b><span>network</span></div><div><small>AVERAGE</small><b>${s.cricsal?.average??'—'}</b><span>runs / match</span></div></div></div></div>`}catch(e){document.querySelector('main').insertAdjacentHTML('afterbegin',`<div class="data-error">CASPER DATA ERROR · ${e.message}</div>`)}})();</script></body></html>
