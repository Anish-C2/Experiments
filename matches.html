<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASPER — Match Centre</title><link rel="stylesheet" href="css/style.css?v=9"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">C</span>CASPER</a><nav><a href="index.html">HOME</a><a href="sectors.html">SECTORS</a><a href="competitions.html">COMPETITIONS</a><a href="clubs.html">CLUBS</a><a href="players.html">PLAYERS</a><a href="records.html">RECORDS</a><a href="docs.html">DOCS</a></nav></header><main><section class="mast"><div><span class="eyebrow">CASPER // ARCHIVE</span><h1>MATCH CENTRE</h1><p>Central view of recorded results with explicit football, futsal and Cricsal statistical boundaries.</p></div></section><div id="matches"></div></main><script src="js/data.js"></script><script>(async()=>{try{const d=await CASPER_DATA.load(),rows=d.dashboard.results||[],s=d.dashboard.sports||{},h=document.querySelector('#matches'),icons={football:'⚽',futsal:'🥅',cricsal:'🏏'};const render=list=>{h.querySelector('#match-list').innerHTML=list.map(r=>`<div class="result" style="min-height:70px"><small>${r.status}<br>${r.competition} · ${r.round}</small><strong>${r.home}<br>${r.away}</strong><b>${r.score}</b><small>${r.duration}</small><em>${icons[r.sport]||''}</em></div>`).join('')||'<p>No matches recorded for this filter.</p>'};h.innerHTML=`<div class="stats">${[['TOTAL MATCHES',rows.length,'record rows'],['FOOTBALL',s.football?.matches??0,'matches'],['FOOTBALL GOALS',s.football?.goals??0,'goals'],['FUTSAL',s.futsal?.matches??0,'matches'],['FUTSAL GOALS',s.futsal?.goals??0,'goals'],['CRICSAL',s.cricsal?.matches??0,'matches'],['CRICSAL RUNS',s.cricsal?.runs??0,'runs'],['CRICSAL WICKETS',s.cricsal?.wickets??0,'wickets']].map(x=>`<div><small>${x[0]}</small><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('')}</div><section class="box" style="margin-top:10px"><header><div><small>RESULT ARCHIVE</small><h2>RECENT RESULTS</h2></div><span id="filter-status">ALL SPORTS</span></header><div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0"><button data-s="all">ALL</button><button data-s="football">⚽ FOOTBALL</button><button data-s="futsal">🥅 FUTSAL</button><button data-s="cricsal">🏏 CRICSAL</button></div><div id="match-list"></div></section>`;render(rows);h.querySelectorAll('button').forEach(b=>b.onclick=()=>{const sport=b.dataset.s;document.querySelector('#filter-status').textContent=sport==='all'?'ALL SPORTS':sport.toUpperCase();render(sport==='all'?rows:rows.filter(r=>r.sport===sport))})}catch(e){document.querySelector('main').insertAdjacentHTML('afterbegin',`<div class="data-error">CASPER DATA ERROR · ${e.message}</div>`)}})();</script></body></html>
