<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASPER — Match Centre</title><link rel="stylesheet" href="css/style.css?v=5"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">C</span>CASPER</a><nav><a href="index.html">HOME</a><a href="sectors.html">SECTORS</a><a href="competitions.html">COMPETITIONS</a><a href="clubs.html">CLUBS</a><a href="players.html">PLAYERS</a><a href="records.html">RECORDS</a><a href="docs.html">DOCS</a></nav></header><main><section class="mast"><div><span class="eyebrow">CASPER // ARCHIVE</span><h1>MATCH CENTRE</h1><p>Central view of recorded results. Official event data belongs to the CSN archive.</p></div></section><section class="box" style="margin-top:10px"><div id="match-list"></div></section></main><script src="js/data.js"></script><script>CASPER_DATA.load().then(d=>{const h=document.querySelector('#match-list');h.innerHTML=(d.dashboard.results||[]).map(r=>`<div class="result" style="min-height:70px"><small>${r.status}<br>${r.competition} · ${r.round}</small><strong>${r.home}<br>${r.away}</strong><b>${r.score}</b><small>${r.duration}</small><em>${({football:'⚽',futsal:'🥅',cricsal:'🏏'})[r.sport]||''}</em></div>`).join('')||'<p>No matches recorded.</p>'}).catch(e=>document.querySelector('main').insertAdjacentHTML('afterbegin',`<div class="data-error">${e.message}</div>`))</script></body></html>
